

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRAMS | Change Password</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 25px 16px;
            display: grid;
            place-items: center;
            background: #091426;
            color: #f1f5f9;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .card {
            padding: 28px;
            background: #12223b;
            border: 1px solid #293d5a;
            border-radius: 15px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #9fb0c9;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            background: #09162a;
            color: white;
            border: 1px solid #344967;
            border-radius: 8px;
        }

        input:focus {
            outline: 2px solid #2563eb;
            outline-offset: 1px;
        }

        button, .back {
            display: inline-block;
            margin-top: 22px;
            padding: 12px 16px;
            border: 0;
            border-radius: 8px;
            color: white;
            background: #2563eb;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        .back {
            margin-left: 7px;
            background: #334155;
        }

        .message {
            padding: 12px;
            margin-top: 18px;
            border-radius: 8px;
            background: #18334f;
            color: #bfdbfe;
            font-size: 14px;
        }

        @media (max-width: 420px) {
            .card {
                padding: 20px;
            }

            .back {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <section class="card">
            <h1>Change Password</h1>

            <p class="subtitle">
                Update your account password to help protect
                your FRAMS account.
            </p>

            <form method="POST"
                  action="{{ url_for('change_password') }}">

                <label for="current_password">Current Password</label>
                <input
                    type="password"
                    id="current_password"
                    name="current_password"
                    autocomplete="current-password"
                    required
                >

                <label for="new_password">New Password</label>
                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <label for="confirm_password">Confirm New Password</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <button type="submit">Update Password</button>

                <a class="back"
                   href="{% if session.get('role') == 'admin' %}{{ url_for('admin_dashboard') }}{% else %}{{ url_for('student_dashboard') }}{% endif %}">
                    Back
                </a>
            </form>

            {% with messages = get_flashed_messages() %}
                {% for message in messages %}
                    <div class="message" role="status">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endwith %}
        </section>
    </main>
</body>
</html>
