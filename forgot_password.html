

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRAMS | Forgot Password</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #f1f5f9;
            background: linear-gradient(135deg, #071225, #10264a);
        }

        .card {
            width: 100%;
            max-width: 430px;
            padding: 30px;
            background: #101d34;
            border: 1px solid #263e62;
            border-radius: 18px;
            box-shadow: 0 20px 55px #0005;
        }

        h1 {
            font-size: 25px;
            margin-bottom: 10px;
        }

        p {
            color: #9caec8;
            line-height: 1.6;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            color: #dbeafe;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 13px;
            color: white;
            background: #09162a;
            border: 1px solid #344967;
            border-radius: 9px;
        }

        button, .back {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: 0;
            border-radius: 9px;
            text-align: center;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
        }

        button {
            color: white;
            background: #2563eb;
        }

        .back {
            width: auto;
            color: #bfdbfe;
            background: #263750;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #47212a;
            color: #fecaca;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Forgot Password?</h1>

        <p>
            Enter your account type and registered details to begin
            the password recovery process.
        </p>

        <form method="POST" action="{{ url_for('forgot_password') }}">
            <label for="role">Account Type</label>
            <select id="role" name="role" required>
                <option value="student">Student</option>
                <option value="admin">Administrator</option>
            </select>

            <label for="user_id">User ID</label>
            <input id="user_id" name="user_id"
                   type="text" maxlength="50"
                   placeholder="Enter your User ID" required>

            <label for="email">Registered Email ID</label>
            <input id="email" name="email" type="email"
                   maxlength="254"
                   placeholder="Enter your registered email"
                   required>

            <button type="submit">Continue</button>
        </form>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message" role="status">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <a class="back" href="{{ url_for('login') }}">
            Back to Login
        </a>
    </main>
</body>
</html>
