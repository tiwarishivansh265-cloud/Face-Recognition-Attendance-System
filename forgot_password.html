
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | FRAMS</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: #e5e7eb;
            background: #0b1220;
        }
        .box {
            width: 100%;
            max-width: 420px;
            padding: 28px;
            background: #111c32;
            border: 1px solid #263653;
            border-radius: 15px;
        }
        h1 { color: #60a5fa; margin-top: 0; }
        p { color: #cbd5e1; line-height: 1.6; }
        label { display: block; margin: 16px 0 8px; }
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0b1220;
            color: white;
        }
        button, .back {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 18px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
        }
        .back { background: #334155; }
        .message {
            padding: 10px;
            border-radius: 8px;
            background: #172554;
            margin: 12px 0;
        }
    </style>
</head>
<body>
    <main class="box">
        <h1>Forgot Password?</h1>
        <p>Enter your account details and submit your request.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <label for="role">Account Type</label>
            <select id="role" name="role" required>
                <option value="student">Student</option>
                <option value="faculty">Faculty</option>
                <option value="admin">Admin</option>
            </select>

            <label for="user_id">Student / Faculty ID or Admin Username</label>
            <input id="user_id" name="user_id" type="text"
                   autocomplete="username" required>

            <button type="submit">Submit Request</button>
        </form>

        <a class="back" href="{{ url_for('login') }}">Back to Login</a>
    </main>
</body>
</html>
